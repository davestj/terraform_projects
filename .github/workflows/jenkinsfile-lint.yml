name: Jenkinsfile Lint

on:
  push:
    branches:
      - devel
  pull_request:
    branches:
      - devel

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          
      - name: Install Jenkinsfile Linter
        run: npm install -g jenkinsfile-linter

      - name: Lint Jenkinsfile
        run: jenkinsfile-linter Jenkinsfile

