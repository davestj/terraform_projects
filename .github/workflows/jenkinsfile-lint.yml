name: Jenkinsfile Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      
      - name: Set up Java
        uses: actions/setup-java@v2
        with:
          java-version: '11'
          
      - name: Install Jenkinsfile Linter
        run: npm install -g jenkinsfile-linter

      - name: Lint Jenkinsfile
        run: jenkinsfile-linter Jenkinsfile

